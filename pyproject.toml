# uv workspace root. The worker depends on the API package so that models and
# business rules are shared rather than duplicated, per the constitution.
[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated DDL by hand is churn, and the
# real checks (undefined names, unused imports) still apply.
"apps/api/migrations/versions/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both workspace packages are declared here rather than relied upon through the
# editable install: the .pth files uv/hatchling generate carry no trailing
# newline, so Python's site module silently skips them and neither package
# reaches sys.path. Without this, tests only pass when cwd happens to be the
# package directory.
pythonpath = ["apps/api", "apps/worker"]
