[project]
name = "step-job-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dramatiq[redis]>=1.17",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "step-job-api",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv.sources]
step-job-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
# The worker shares the API's models rather than duplicating them, so the API
# package is on the path here too. See the note in apps/api/pyproject.toml for
# why the editable install cannot be relied on for this.
pythonpath = [".", "../api"]
