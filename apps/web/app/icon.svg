<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The 2018 launcher icon: footprints walking across a light blue tile.
       The prints are white rather than charcoal because at 16px in a browser
       tab, charcoal on blue closes up into a smudge. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cc8f5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <g fill="#ffffff">
    <g opacity="0.45" transform="rotate(-24 18 46)">
      <ellipse cx="18" cy="43" rx="5.4" ry="8.2" />
      <ellipse cx="18" cy="53.5" rx="4" ry="4.2" />
    </g>
    <g opacity="0.75" transform="rotate(-24 32 35)">
      <ellipse cx="32" cy="32" rx="5.4" ry="8.2" />
      <ellipse cx="32" cy="42.5" rx="4" ry="4.2" />
    </g>
    <g transform="rotate(-24 46 24)">
      <ellipse cx="46" cy="21" rx="5.4" ry="8.2" />
      <ellipse cx="46" cy="31.5" rx="4" ry="4.2" />
    </g>
  </g>
</svg>
