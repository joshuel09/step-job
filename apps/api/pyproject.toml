[project]
name = "step-job-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the 0.115 line: on 0.141 in this environment include_router
    # silently registers no routes, even for a single-route router.
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Deterministic document text extraction. Not a model task: using one would
    # add a fabrication surface where none is needed (research.md R-005).
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Used only behind the AIProvider abstraction (constitution gate G12).
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
# The editable-install .pth files carry no trailing newline, so Python's site
# module skips them and this package never reaches sys.path. Declared here so
# the suite runs from any working directory rather than only from this one.
pythonpath = ["."]
markers = [
    # The one test that calls a real provider. Excluded by default: a test whose
    # outcome depends on a model's mood tests nothing.
    "live: calls a real model provider; requires a key and is skipped without one",
]
