services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stepjob
      POSTGRES_PASSWORD: stepjob
      POSTGRES_DB: stepjob
    ports:
      # Override with POSTGRES_PORT if 5432 is already taken on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepjob"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
